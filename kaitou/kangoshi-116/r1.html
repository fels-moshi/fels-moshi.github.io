const KNAME={H:"必修",I:"一般",J:"状況設定"};
const ST="kango116_r1_v19";
let ans={}, view="am", remain=9600, running=false, tick=null;
try{const s=JSON.parse(localStorage.getItem(ST)||"{}"); ans=s.ans||{}; if(typeof s.remain==="number") remain=s.remain;}catch(e){}
function save(){try{localStorage.setItem(ST,JSON.stringify({ans,remain}))}catch(e){}}
const id=q=>(q[0]?"p":"a")+q[1];
function fmt(t){const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function isDone(q){const v=ans[id(q)];if(q[3]==="c")return v!==undefined&&v!=="";if(!v)return false;return v.length===(q[4].length)}
function counts(){[0,1].forEach(s=>{const n=KEY.filter(q=>q[0]===s&&isDone(q)).length;document.getElementById(s?"cnt-pm":"cnt-am").textContent=n+"/120"})}
function render(){
  const s=view==="pm"?1:0, el=document.getElementById("sheet"); el.innerHTML="";
  const blocks=[["必修問題",1,25],["一般問題",26,90],["状況設定問題",91,120]];
  blocks.forEach(([name,a,b])=>{
    const box=document.createElement("div");box.className="sheet";box.style.marginBottom="12px";
    box.innerHTML=`<div class="blockhead"><span>${s?"午後":"午前"}　${name}</span><span>問${a}〜${b}</span></div>`;
    KEY.filter(q=>q[0]===s&&q[1]>=a&&q[1]<=b).forEach(q=>{
      const r=document.createElement("div");r.className="row";const k=id(q);
      let inner="";
      if(q[3]==="c"){inner=`<input class="num" id="in-${k}" inputmode="decimal" placeholder="数値" value="${ans[k]??""}" aria-label="問${q[1]}の解答"><span class="unit">単位：${q[5]}</span>`}
      else{const sel=ans[k]||"";for(let i=1;i<=q[3];i++)inner+=`<button class="oval" id="o-${k}-${i}" aria-pressed="${sel.includes(String(i))}" data-k="${k}" data-i="${i}" data-two="${q[4].length>1}" aria-label="問${q[1]} ${i}">${i}</button>`;
        if(q[4].length>1)inner+=`<span class="tag">2つ</span>`}
      r.innerHTML=`<div class="qno">${q[1]}<small>${KNAME[q[2]]}</small></div><div class="ovals">${inner}</div>`;
      box.appendChild(r)});
    el.appendChild(box)});
}
document.getElementById("sheet").addEventListener("click",e=>{
  const b=e.target.closest(".oval");if(!b)return;const k=b.dataset.k,i=b.dataset.i,two=b.dataset.two==="true";
  let v=ans[k]||"";
  if(v.includes(i))v=v.replace(i,"");else if(two){v=(v.length>=2?v.slice(1):v)+i}else v=i;
  v=v.split("").sort().join("");ans[k]=v;save();
  b.parentElement.querySelectorAll(".oval").forEach(o=>o.setAttribute("aria-pressed",v.includes(o.dataset.i)));counts()});
document.getElementById("sheet").addEventListener("input",e=>{if(e.target.classList.contains("num")){ans[e.target.id.slice(3)]=e.target.value.trim();save();counts()}});
function correct(q){const v=ans[id(q)];if(q[3]==="c"){const n=parseFloat(String(v??"").replace(/[^\d.+-]/g,""));return !isNaN(n)&&Math.abs(n-parseFloat(q[4]))<1e-9}return v===q[4]}
function grade(){
  const res={H:[0,0],I:[0,0],J:[0,0]},dom={},wrong=[];
  KEY.forEach(q=>{const c=correct(q);res[q[2]][1]++;if(c)res[q[2]][0]++;
    dom[q[6]]=dom[q[6]]||[0,0];dom[q[6]][1]++;if(c)dom[q[6]][0]++;
    if(!c)wrong.push(q)});
  const hs=res.H[0], gen=res.I[0]+res.J[0]*2, genMax=res.I[1]+res.J[1]*2;
  const answered=KEY.filter(isDone).length;
  const pass=hs>=40;
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  const rows=Object.entries(dom).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([d,[c,n]])=>{const p=pct(c,n);return `<tr><td>${d}</td><td>${c}/${n}</td><td style="width:40%"><div class="meter ${p<60?"low":""}"><span style="width:${p}%"></span></div></td><td>${p}%</td></tr>`}).join("");
  const wl=wrong.map(q=>{const v=ans[id(q)];const yours=(v===undefined||v==="")?"未解答":(q[3]==="c"?v:v.split("").join("・"));const key=q[3]==="c"?q[4]+q[5]:q[4].split("").join("・");return `<span>${q[0]?"午後":"午前"}${q[1]}　あなた ${yours} → 正答 <b>${key}</b></span>`}).join("");
  document.getElementById("v-res").innerHTML=`
  <div class="summary">
    <div class="card"><h3>必修問題（50点満点）</h3><div class="big">${hs}<small> / 50点</small></div>
      <span class="pill ${pass?"ok":"ng"}">${pass?"合格基準（40点）に到達":"合格基準（40点）まであと"+(40-hs)+"点"}</span>
      <p class="note">必修は毎年、満点の8割が基準です。</p></div>
    <div class="card"><h3>一般・状況設定（250点満点）</h3><div class="big">${gen}<small> / ${genMax}点（${pct(gen,genMax)}%）</small></div>
      <p class="note">一般は1問1点、状況設定は1問2点。合格基準は毎年の全体の結果で決まるため、本書では得点率で示します。</p></div>
    <div class="card"><h3>解答した問題</h3><div class="big">${answered}<small> / 240問</small></div>
      <p class="note">一般 ${res.I[0]}/${res.I[1]}問・状況設定 ${res.J[0]}/${res.J[1]}問 正解</p></div>
  </div>
  <h2>分野別の正答率（低い順）</h2>
  <div class="tblwrap"><table><thead><tr><th>分野</th><th>正解</th><th>正答率</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="note">6割未満の分野は赤で示しています。本の解説編で、その分野の問題から復習してください。</p>
  <h2>まちがえた問題（${wrong.length}問）</h2>
  <div class="wrong">${wl||"<span>すべて正解です</span>"}</div>`;
  show("res");
}
function show(v){view=v;["am","pm","res"].forEach(x=>document.getElementById("tab-"+x).setAttribute("aria-selected",x===v));
  document.getElementById("v-sheet").hidden=v==="res";document.getElementById("v-res").hidden=v!=="res";if(v!=="res")render();window.scrollTo(0,0)}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{t.dataset.v==="res"?grade():show(t.dataset.v)}));
["grade","grade2"].forEach(x=>document.getElementById(x).addEventListener("click",grade));
document.getElementById("tbtn").addEventListener("click",e=>{running=!running;e.target.textContent=running?"一時停止":"タイマー再開";
  if(running)tick=setInterval(()=>{if(remain>0){remain--;document.getElementById("timer").textContent=fmt(remain);if(remain%10===0)save()}else{clearInterval(tick);running=false;e.target.textContent="時間終了"}},1000);else clearInterval(tick)});
document.getElementById("clear").addEventListener("click",()=>document.getElementById("confirm").hidden=false);
document.getElementById("cno").addEventListener("click",()=>document.getElementById("confirm").hidden=true);
document.getElementById("cyes").addEventListener("click",()=>{ans={};remain=9600;document.getElementById("timer").textContent=fmt(remain);save();document.getElementById("confirm").hidden=true;render();counts()});
document.getElementById("sample").addEventListener("click",()=>{KEY.forEach((q,i)=>{const k=id(q);if(q[3]==="c")ans[k]=i%3?q[4]:"0";else{const right=(i*7)%10<7;ans[k]=right?q[4]:(q[4].length>1?"12":String(q[4]==="1"?2:1))}});save();render();counts()});
document.getElementById("timer").textContent=fmt(remain);
render();counts();
</script>
